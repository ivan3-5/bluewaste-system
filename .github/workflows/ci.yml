name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Checks (Typecheck & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Typecheck
        working-directory: ./backend
        run: npm run typecheck
        
      - name: Run Integration Tests
        working-directory: ./backend
        run: npm test
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: dummy_jwt_secret_key_123
          REFRESH_TOKEN_SECRET: dummy_refresh_secret_key_123
          CLOUDINARY_CLOUD_NAME: dummy_cloud
          CLOUDINARY_API_KEY: dummy_key
          CLOUDINARY_API_SECRET: dummy_secret

  web-typecheck:
    name: Web App Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Typecheck
        working-directory: ./web
        run: npm run typecheck

  mobile-analyze:
    name: Mobile Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        working-directory: ./mobile_flutter
        run: flutter pub get
        
      - name: Run Flutter Analyze
        working-directory: ./mobile_flutter
        run: flutter analyze
