<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Worker Route Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e2e8f0;
    }

    /* ── Loading overlay ── */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(248, 250, 252, 0.96);
      backdrop-filter: blur(4px);
    }

    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #0066cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #loading p {
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Worker marker (blue pulsing dot) ── */
    .worker-marker-wrap {
      position: relative;
      width: 36px;
      height: 36px;
    }

    .worker-marker-wrap .pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(0, 102, 204, 0.3);
      animation: pulse 1.8s ease-out infinite;
    }

    .worker-marker-wrap .dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      background: #0066cc;
      border: 3px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 10px rgba(0, 102, 204, 0.6);
    }

    @keyframes pulse {
      0%   { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ── Numbered stop marker ── */
    .stop-marker {
      width: 32px;
      height: 32px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      border: 2px solid #ffffff;
    }

    .stop-marker span {
      display: block;
      transform: rotate(45deg);
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    /* ── Popup styles ── */
    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18) !important;
      padding: 0 !important;
      overflow: hidden;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      width: auto !important;
    }

    .popup-inner {
      padding: 14px 16px 12px;
      min-width: 210px;
      max-width: 270px;
    }

    .popup-stop-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      color: #0066cc;
      background: rgba(0, 102, 204, 0.1);
      border-radius: 20px;
      padding: 3px 8px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .popup-title {
      font-size: 13px;
      font-weight: 700;
      color: #020817;
      margin-bottom: 3px;
      line-height: 1.3;
    }

    .popup-category {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .popup-coords {
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 10px;
      font-family: monospace;
    }

    .popup-divider {
      height: 1px;
      background: #e2e8f0;
      margin: 0 -16px 10px;
    }

    .btn-resolve {
      width: 100%;
      padding: 9px 14px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-resolve:active {
      opacity: 0.85;
      transform: scale(0.97);
    }

    .btn-resolve.resolved {
      background: #94a3b8;
      cursor: default;
    }

    /* ── Floating Controls ── */
    #recenter-btn {
      position: absolute;
      bottom: 24px;
      right: 14px;
      z-index: 1000;
      width: 44px;
      height: 44px;
      background: #ffffff;
      border-radius: 50%;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0066cc;
      transition: background 0.15s;
    }

    #recenter-btn:active {
      background: #f1f5f9;
    }

    /* ── Legend ── */
    #legend {
      position: absolute;
      bottom: 24px;
      left: 14px;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      border: 1px solid #e2e8f0;
      font-size: 11px;
      color: #374151;
      backdrop-filter: blur(4px);
    }

    #legend .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    #legend .legend-row:last-child { margin-bottom: 0; }

    #legend .dot-blue {
      width: 12px; height: 12px;
      background: #0066cc;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1.5px #0066cc;
      flex-shrink: 0;
    }

    #legend .dot-stop {
      width: 12px; height: 12px;
      background: #f97316;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #legend .line-route {
      width: 20px; height: 3px;
      background: #0066cc;
      border-radius: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div id="map"></div>

<button id="recenter-btn" title="Recenter Route" onclick="recenterRoute()">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
  </svg>
</button>

<div id="legend">
  <div class="legend-row">
    <div class="dot-blue"></div>
    <span>Your location</span>
  </div>
  <div class="legend-row">
    <div class="dot-stop"></div>
    <span>Report stop</span>
  </div>
  <div class="legend-row">
    <div class="line-route"></div>
    <span>Route line</span>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const STOP_COLORS = [
    '#f97316','#8b5cf6','#ec4899','#14b8a6',
    '#f59e0b','#6366f1','#ef4444','#10b981',
  ];

  function stopColor(index) {
    return STOP_COLORS[index % STOP_COLORS.length];
  }

  function makeWorkerIcon() {
    return L.divIcon({
      html: `<div class="worker-marker-wrap">
               <div class="pulse"></div>
               <div class="dot"></div>
             </div>`,
      iconSize:   [36, 36],
      iconAnchor: [18, 18],
      popupAnchor:[0, -20],
      className:  '',
    });
  }

  function makeStopIcon(number, color) {
    return L.divIcon({
      html: `<div class="stop-marker" style="background:${color};">
               <span>${number}</span>
             </div>`,
      iconSize:   [32, 32],
      iconAnchor: [16, 32],
      popupAnchor:[0, -34],
      className:  '',
    });
  }

  const CATEGORY_LABELS = {
    with_waste:    'With Waste',
    no_waste:      'No Waste',
    PLASTIC_WASTE: 'Plastic Waste',
    ORGANIC_WASTE: 'Organic Waste',
    GLASS_WASTE:   'Glass Waste',
    METAL_WASTE:   'Metal Waste',
    PAPER_WASTE:   'Paper Waste',
  };

  let map = null;
  let activeBounds = null;
  const resolvedIds = new Set();

  function ensureMap() {
    if (map) return;
    map = L.map('map', {
      zoomControl: true,
      attributionControl: true,
      minZoom: 3,
      maxZoom: 19,
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      minZoom: 3,
      maxZoom: 19,
      noWrap: true,
      bounds: [[-85, -180], [85, 180]],
      attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);
  }

  function recenterRoute() {
    if (map && activeBounds) {
      map.fitBounds(activeBounds, { padding: [48, 48], maxZoom: 16 });
    }
  }

  async function initRoute(waypoints) {
    ensureMap();

    // Clear existing non-tile layers
    map.eachLayer(layer => {
      if (!(layer instanceof L.TileLayer)) {
        map.removeLayer(layer);
      }
    });

    if (!waypoints || waypoints.length === 0) return;

    const workerWp = waypoints[0];
    const reportWps = waypoints.slice(1);

    // Place worker marker at workerWp
    L.marker([workerWp.lat, workerWp.lng], { icon: makeWorkerIcon(), zIndexOffset: 1000 })
      .addTo(map)
      .bindPopup(`
        <div class="popup-inner">
          <div class="popup-stop-badge">📍 Your Location</div>
          <div class="popup-title">You are here</div>
          <div class="popup-coords">${workerWp.lat.toFixed(5)}, ${workerWp.lng.toFixed(5)}</div>
        </div>
      `);

    // Place report stop markers
    for (let i = 0; i < reportWps.length; i++) {
      const wp = reportWps[i];
      const stopNum = i + 1;
      const color = stopColor(i);
      const catLabel = CATEGORY_LABELS[wp.category] || wp.category || '';

      const marker = L.marker([wp.lat, wp.lng], { icon: makeStopIcon(stopNum, color) }).addTo(map);

      const popupContent = `
        <div class="popup-inner">
          <div class="popup-stop-badge">Stop ${stopNum}</div>
          <div class="popup-title">${(wp.title || 'Waste Report').replace(/</g, '&lt;')}</div>
          ${catLabel ? `<div class="popup-category">${catLabel}</div>` : ''}
          <div class="popup-coords">${wp.lat.toFixed(5)}, ${wp.lng.toFixed(5)}</div>
          <div class="popup-divider"></div>
          <button class="btn-resolve ${resolvedIds.has(wp.id) ? 'resolved' : ''}"
                  onclick="markResolved('${wp.id}', this)"
                  ${resolvedIds.has(wp.id) ? 'disabled' : ''}>
            ${resolvedIds.has(wp.id) ? '✓ Resolved' : 'Mark as Resolved'}
          </button>
        </div>
      `;

      marker.bindPopup(popupContent, { maxWidth: 280 });
    }

    // Fit map bounds around worker location + all report stops
    const allLatLngs = waypoints.map(w => L.latLng(w.lat, w.lng));
    activeBounds = L.latLngBounds(allLatLngs);
    map.fitBounds(activeBounds, { padding: [52, 52], maxZoom: 16 });

    // Draw route line from worker location to report marks
    let polylineDrawn = false;
    if (waypoints.length >= 2) {
      try {
        const coordsStr = waypoints.map(w => `${w.lng},${w.lat}`).join(';');
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`;
        const res = await fetch(osrmUrl);
        if (res.ok) {
          const data = await res.json();
          const route = data?.routes?.[0];
          if (route?.geometry?.coordinates && route.geometry.coordinates.length > 0) {
            const lineCoords = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
            L.polyline(lineCoords, {
              color: '#0066cc',
              weight: 6,
              opacity: 0.9,
            }).addTo(map);
            polylineDrawn = true;
          }
        }
      } catch (e) {
        console.warn('OSRM routing fetch failed:', e);
      }

      // Fallback: draw direct polyline connecting worker to report mark
      if (!polylineDrawn) {
        const linePts = waypoints.map(w => [w.lat, w.lng]);
        L.polyline(linePts, {
          color: '#0066cc',
          weight: 5,
          opacity: 0.85,
          dashArray: '8, 8',
        }).addTo(map);
      }
    }
  }

  function markResolved(reportId, btn) {
    if (!reportId || resolvedIds.has(reportId)) return;

    resolvedIds.add(reportId);
    btn.textContent = '✓ Resolved';
    btn.disabled = true;
    btn.classList.add('resolved');

    try {
      RouteChannel.postMessage(reportId);
    } catch (e) {
      console.warn('RouteChannel not available:', e);
    }
  }
</script>
</body>
</html>
